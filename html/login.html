<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-banner">
            <img src="https://via.placeholder.com/450x500.png?text=Banner+Hotel+Pet" alt="Banner Ilustrativo Hotel Pet">
        </div>

        <div class="auth-form-box">
            <h1 class="brand-title">Hotel Pet</h1>

            <form action="reservas.html" method="get">
                <div class="form-group">
                    <input type="text" id="login" name="login" placeholder="Login" required>
                </div>

                <div class="form-group password-group">
                    <input type="password" id="senha" name="senha" placeholder="Senha" required>
                    <span class="password-toggle">👁️</span>
                </div>

                <div class="auth-options">
                    <label>
                        <input type="checkbox" name="manter-conectado" checked> mantenha-me conectado
                    </label>
                    <a href="#" class="link-small">Esqueci a senha</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Enviar</button>

                <div class="auth-divider">
                    <span>ou</span>
                </div>

                <div class="social-login">
                    <a href="#" class="social-btn">f</a>
                    <a href="#" class="social-btn">t</a>
                    <a href="#" class="social-btn">g</a>
                </div>

                <div class="auth-footer">
                    <a href="criar-conta.html" class="link-action">Criar uma conta</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
