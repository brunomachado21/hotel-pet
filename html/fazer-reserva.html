<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Fazer Reserva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

    <header class="app-header">
        <div class="header-logo">
            <h2>Hotel Pet</h2>
        </div>
        <div class="header-user">
            <a href="editar-perfil.html" class="user-info">
                <img src="https://via.placeholder.com/40.png?text=Avatar" alt="Avatar do Gerente" class="avatar">
                <span>João da Silva</span>
            </a>
        </div>
    </header>

    <div class="app-layout">
        <aside class="app-sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="cadastrar-pet.html">🐾 Pet</a></li>
                    <li><a href="usuarios.html">👤 Usuários</a></li>
                    <li><a href="configuracoes.html">⚙️ Configurações</a></li>
                    <li><a href="reservas.html" class="active">📖 Reservas</a></li>
                </ul>
            </nav>
        </aside>

        <main class="app-content">
            <div class="breadcrumb">
                <span>Home / revervas / nova reserva</span>
            </div>

            <div class="panel-card form-panel">
                <h2>Fazer reserva</h2>

                <form action="reservas.html" method="get">
                    <div class="form-group">
                        <label for="res-pet-input">Pet *</label>
                        <input type="text" id="res-pet-input" name="pet" value="Max" required>
                    </div>

                    <div class="form-group">
                        <label>Período *</label>
                        <div class="date-range">
                            <input type="date" value="2021-05-02" required>
                            <input type="date" value="2021-05-07" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="res-notas">Notas</label>
                        <textarea id="res-notas" rows="4" placeholder="Lorem ipsum dolor sit amet, consectetur adipiscing elit."></textarea>
                    </div>

                    <div class="total-diarias">
                        <span>Total das diárias: </span>
                        <strong class="text-blue">R$ 40,00</strong>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">💾 Salvar</button>
                        <button type="reset" class="btn btn-outline">🔄 Limpar</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
