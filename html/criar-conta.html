<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Criar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-banner">
            <img src="https://via.placeholder.com/450x500.png?text=Banner+Hotel+Pet" alt="Banner Ilustrativo Hotel Pet">
        </div>

        <div class="auth-form-box">
            <h1 class="brand-title">Hotel Pet</h1>

            <form action="login.html" method="get">
                <div class="form-group">
                    <input type="text" id="novo-login" name="login" placeholder="Login" required>
                </div>

                <div class="form-group password-group">
                    <input type="password" id="nova-senha" name="senha" placeholder="Senha" required>
                    <span class="password-toggle">👁️</span>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Criar conta</button>

                <div class="auth-footer">
                    <a href="login.html" class="link-action">Já tem conta? Login</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
